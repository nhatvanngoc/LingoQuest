<!--
  LingoQuest Favicon — checklist 1.5
  - SVG favicon: 512x512 viewBox, square, vector scalable.
  - Gradient bg from-brand (#2563EB) to violet-600 (#8B5CF6), rounded-2xl (rx 112).
  - Center Sparkles icon (lucide-react) in white, stroke 2.5, 24x24 scaled to ~180px.
  - Icons are SVG, same square dimension, black base (lucide default) tinted via Tailwind.
  - Custom icons (if added) MUST be named icon-* lowercase with dashes, e.g. icon-sparkles.svg
  - For PNG/ICO raster: run `python scripts/generate_favicon.py` or use https://realfavicongenerator.net
  - Next.js will serve this at /favicon.svg; layout.tsx also declares /favicon.ico + /icon-512.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LingoQuest favicon">
  <defs>
    <linearGradient id="lq-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <!-- subtle highlight overlay -->
    <linearGradient id="lq-highlight" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#lq-grad)"/>
  <rect width="512" height="512" rx="112" fill="url(#lq-highlight)"/>
  <!-- Sparkles icon — centered, white, ~180px -->
  <!-- Outer sparkle (large) -->
  <g transform="translate(256 256) scale(8.5)" stroke="white" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- lucide Sparkles paths approximated at 24x24 grid, centered at 0,0 -->
    <!-- star 1: top-center -->
    <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.937A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .963L15.5 14.063A2 2 0 0 0 14.063 15.5l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
    <!-- star 2: bottom-right small -->
    <path d="M20 3v4"/>
    <path d="M22 5h-4"/>
    <!-- star 3: top-right -->
    <path d="M20 17v2"/>
    <path d="M21 18h-2"/>
  </g>
  <!-- Fallback text-free: no letters, pure icon for high-DPI -->
</svg>
